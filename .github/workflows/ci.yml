name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.lock
      - name: tests (offline, mock providers, in-memory store)
        run: PYTHONPATH=src pytest -q
      - name: eval smoke
        run: PYTHONPATH=src python eval/run_eval.py
      - name: quality regression gate
        run: PYTHONPATH=src python eval/run_quality_gate.py

  gateway-docker:
    runs-on: ubuntu-latest
    needs: gateway
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/gateway/Dockerfile.gateway -t llm-gateway:ci packages/gateway

  edge-client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/edge-client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install
      - run: npm run typecheck
      - name: tests (node --test, pure core, no browser)
        run: npm test
      - run: npm run eval
