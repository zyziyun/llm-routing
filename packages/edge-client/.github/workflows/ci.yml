name: edge-client ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: packages/edge-client}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm install
      - run: npm run typecheck
      - run: npm test          # node --test, pure core, no browser needed
      - run: npm run eval
