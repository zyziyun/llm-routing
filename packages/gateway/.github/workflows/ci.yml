name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install fastapi "uvicorn[standard]" "pydantic>=2" pydantic-settings httpx prometheus-client pytest
      - name: tests (offline, mock providers, in-memory store)
        run: PYTHONPATH=src pytest -q
      - name: eval smoke
        run: PYTHONPATH=src python eval/run_eval.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.gateway -t llm-gateway:ci .
