[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router-lab"
version = "0.1.0"
description = "A small, deployable LLM router / gateway: classify, route SLM-first, quality-gate, escalate."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Lab core runs with zero deps on mock providers. Add these to serve.
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
# Production gateway (src/gateway): shared state, settings, metrics.
gateway = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2",
  "pydantic-settings>=2", "prometheus-client>=0.20", "redis>=5", "httpx>=0.27",
]
live = ["httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
llm-router = "router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
