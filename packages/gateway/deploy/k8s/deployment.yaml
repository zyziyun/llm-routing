apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels: {app: llm-gateway}
spec:
  replicas: 3
  selector:
    matchLabels: {app: llm-gateway}
  template:
    metadata:
      labels: {app: llm-gateway}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: gateway
          image: llm-gateway:1.0.0
          ports: [{containerPort: 8000}]
          env:
            - {name: GW_ENV, value: "prod"}
            - {name: GW_REDIS_URL, value: "redis://redis:6379/0"}
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: gateway-secrets, key: openai-api-key}}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: llm-gateway}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
