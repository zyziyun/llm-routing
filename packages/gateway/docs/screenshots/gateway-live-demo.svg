<svg xmlns="http://www.w3.org/2000/svg" width="850" height="858" viewBox="0 0 850 858" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="850" height="858" rx="10" fill="#0f1115"/>
<rect width="850" height="34" rx="10" fill="#171a21"/>
<rect y="24" width="850" height="10" fill="#171a21"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="425" y="21" fill="#9aa4b2" font-size="12" text-anchor="middle">bash demo/live_demo.sh</text>
<text x="22" y="60" fill="#9aa4b2" font-size="14" xml:space="preserve">== health / readiness ==</text>
<text x="22" y="81" fill="#3ddc97" font-size="14" xml:space="preserve">  /healthz -&gt; 200   /readyz -&gt; 200</text>
<text x="22" y="102" fill="#e6e9ef" font-size="14" xml:space="preserve">  /v1/models -&gt; [&#x27;edge&#x27;, &#x27;cheap&#x27;, &#x27;frontier&#x27;]</text>
<text x="22" y="123" fill="#9aa4b2" font-size="14" xml:space="preserve">------------------------------------------------------------</text>
<text x="22" y="144" fill="#9aa4b2" font-size="14" xml:space="preserve">== routing (OpenAI-compatible /v1/chat/completions) ==</text>
<text x="22" y="165" fill="#3ddc97" font-size="14" xml:space="preserve">  tier=edge      difficulty=easy    esc=0 cache=False cost=$0.00000</text>
<text x="22" y="186" fill="#f7a23b" font-size="14" xml:space="preserve">  tier=frontier  difficulty=hard    esc=0 cache=False cost=$0.00043</text>
<text x="22" y="207" fill="#f7a23b" font-size="14" xml:space="preserve">  tier=cheap     difficulty=easy    esc=1 cache=False cost=$0.00002</text>
<text x="22" y="228" fill="#5b8cff" font-size="14" xml:space="preserve">  tier=cache     difficulty=easy    esc=0 cache=True  cost=$0.00000</text>
<text x="22" y="249" fill="#9aa4b2" font-size="14" xml:space="preserve">------------------------------------------------------------</text>
<text x="22" y="270" fill="#9aa4b2" font-size="14" xml:space="preserve">== streaming (SSE) ==</text>
<text x="22" y="291" fill="#5b8cff" font-size="14" xml:space="preserve">  data: {&quot;id&quot;: &quot;chatcmpl-5d4a66616a064fc0&quot;, &quot;object&quot;: &quot;chat.completion.chunk&quot;, &quot;model&quot;: &quot;llama3…</text>
<text x="22" y="312" fill="#5b8cff" font-size="14" xml:space="preserve">  data: {&quot;choices&quot;: [{&quot;index&quot;: 0, &quot;delta&quot;: {&quot;content&quot;: &quot;[edge] &quot;}}]}</text>
<text x="22" y="333" fill="#5b8cff" font-size="14" xml:space="preserve">  data: {&quot;choices&quot;: [{&quot;index&quot;: 0, &quot;delta&quot;: {&quot;content&quot;: &quot;Translate &quot;}}]}</text>
<text x="22" y="354" fill="#9aa4b2" font-size="14" xml:space="preserve">------------------------------------------------------------</text>
<text x="22" y="375" fill="#9aa4b2" font-size="14" xml:space="preserve">== guards ==</text>
<text x="22" y="396" fill="#f7a23b" font-size="14" xml:space="preserve">  no auth        -&gt; 401  (expect 401)</text>
<text x="22" y="417" fill="#3ddc97" font-size="14" xml:space="preserve">  rate-limit #1 -&gt; 200</text>
<text x="22" y="438" fill="#3ddc97" font-size="14" xml:space="preserve">  rate-limit #2 -&gt; 200</text>
<text x="22" y="459" fill="#3ddc97" font-size="14" xml:space="preserve">  rate-limit #3 -&gt; 200</text>
<text x="22" y="480" fill="#f7a23b" font-size="14" xml:space="preserve">  rate-limit #4 -&gt; 429  (rpm=3 exceeded)</text>
<text x="22" y="501" fill="#3ddc97" font-size="14" xml:space="preserve">  budget #1     -&gt; 200</text>
<text x="22" y="522" fill="#3ddc97" font-size="14" xml:space="preserve">  budget #2     -&gt; 200</text>
<text x="22" y="543" fill="#f7a23b" font-size="14" xml:space="preserve">  budget #3     -&gt; 402  (daily $0.0005 exhausted)</text>
<text x="22" y="564" fill="#9aa4b2" font-size="14" xml:space="preserve">------------------------------------------------------------</text>
<text x="22" y="585" fill="#9aa4b2" font-size="14" xml:space="preserve">== Prometheus /metrics (selected) ==</text>
<text x="22" y="606" fill="#3ddc97" font-size="14" xml:space="preserve">  gw_requests_total{outcome=&quot;accepted&quot;,tier=&quot;edge&quot;} 3.0</text>
<text x="22" y="627" fill="#f7a23b" font-size="14" xml:space="preserve">  gw_requests_total{outcome=&quot;accepted&quot;,tier=&quot;frontier&quot;} 3.0</text>
<text x="22" y="648" fill="#3ddc97" font-size="14" xml:space="preserve">  gw_requests_total{outcome=&quot;escalated&quot;,tier=&quot;edge&quot;} 1.0</text>
<text x="22" y="669" fill="#f7a23b" font-size="14" xml:space="preserve">  gw_requests_total{outcome=&quot;accepted&quot;,tier=&quot;cheap&quot;} 1.0</text>
<text x="22" y="690" fill="#5b8cff" font-size="14" xml:space="preserve">  gw_requests_total{outcome=&quot;hit&quot;,tier=&quot;cache&quot;} 3.0</text>
<text x="22" y="711" fill="#3ddc97" font-size="14" xml:space="preserve">  gw_cost_usd_total{tier=&quot;edge&quot;} 0.0</text>
<text x="22" y="732" fill="#f7a23b" font-size="14" xml:space="preserve">  gw_cost_usd_total{tier=&quot;frontier&quot;} 0.00133</text>
<text x="22" y="753" fill="#f7a23b" font-size="14" xml:space="preserve">  gw_cost_usd_total{tier=&quot;cheap&quot;} 1.6e-05</text>
<text x="22" y="774" fill="#9aa4b2" font-size="14" xml:space="preserve">  gw_escalations_total 1.0</text>
<text x="22" y="795" fill="#9aa4b2" font-size="14" xml:space="preserve">  gw_cache_hits_total 3.0</text>
<text x="22" y="816" fill="#9aa4b2" font-size="14" xml:space="preserve">  gw_rate_limited_total 1.0</text>
<text x="22" y="837" fill="#9aa4b2" font-size="14" xml:space="preserve">  gw_budget_blocked_total 1.0</text>
</svg>